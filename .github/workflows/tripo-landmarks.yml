name: tripo-landmarks
on:
  push:
    paths: ["tools/tripo/RUN_LANDMARKS"]
permissions:
  contents: write
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g tripo-cli@0.7.0
      - name: Landmarks
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: bash tools/tripo/avatar3.sh $(head -1 tools/tripo/RUN_LANDMARKS | cut -d" " -f1-2) 2>&1 | tee tools/tripo/last-avatar3.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "tripo-bot"; git config user.email "tripo-bot@users.noreply.github.com"
          git add tools/tripo assets/models || true
          git commit -m "Tripo landmarks output (CI)" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
