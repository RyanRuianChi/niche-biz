name: indexnow
# After a deploy that changes the sitemap, check the live site and tell Bing/Yandex/Seznam (IndexNow) to recrawl.
on:
  push:
    paths: ["sitemap.xml", "tools/seo/INDEXNOW_KEY"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the deploy, check pages
        run: |
          curl -sI https://ryanchi.com/ | grep -i -E "^(HTTP|location)"
          curl -sIL https://ryanchi.com/ | grep -i -E "^(HTTP|location)"
          KEY=$(cat tools/seo/INDEXNOW_KEY)
          for i in $(seq 1 3); do
            [ "$(curl -sL https://ryanchi.com/$KEY.txt)" = "$KEY" ] && break; sleep 20
          done
          for p in "" zh-hant ja ko fr photos art press sitemap.xml robots.txt llms.txt google218b9c922746143d.html; do
            echo "$(curl -s -o /dev/null -w '%{http_code} %{url_effective}' -L https://ryanchi.com/$p) /$p"
          done
          curl -sL https://ryanchi.com/ | grep -o '<title>[^<]*'
      - name: IndexNow
        run: |
          KEY=$(cat tools/seo/INDEXNOW_KEY)
          curl -s -o /dev/null -w 'indexnow %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"www.ryanchi.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://www.ryanchi.com/$KEY.txt\",\"urlList\":[\"https://www.ryanchi.com/\",\"https://www.ryanchi.com/zh-hant\",\"https://www.ryanchi.com/ja\",\"https://www.ryanchi.com/ko\",\"https://www.ryanchi.com/fr\",\"https://www.ryanchi.com/photos\",\"https://www.ryanchi.com/art\",\"https://www.ryanchi.com/press\"]}"
