name: tripo-assets
on:
  push:
    branches-ignore: ["claude/pensive-bardeen-h0se4f"]   # never spend Tripo credits from the production branch
    paths: ["tools/tripo/RUN_ASSETS"]
permissions:
  contents: write
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g tripo-cli@0.7.0
      - name: Assets
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: bash tools/tripo/assets.sh 2>&1 | tee tools/tripo/last-assets.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "tripo-bot"; git config user.email "tripo-bot@users.noreply.github.com"
          git add tools/tripo assets/models || true
          git commit -m "Tripo assets output (CI)" || echo "nothing to commit"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
