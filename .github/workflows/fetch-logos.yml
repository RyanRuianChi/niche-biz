name: fetch-logos
on:
  push:
    paths: [".github/workflows/fetch-logos.yml", "tools/fetch_logos.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_logos.py
      - run: |
          git config user.name "logo-bot"
          git config user.email "logo-bot@users.noreply.github.com"
          git add logo-candidates
          git commit -m "Add logo candidates (CI)" || echo "nothing to commit"
          git push
