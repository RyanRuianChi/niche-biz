name: fetch-sources
on:
  push:
    paths: [".github/workflows/fetch-sources.yml", "tools/fetch_sources.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_sources.py | tee _fetch.log
      - run: |
          mkdir -p _fetched && mv _fetch.log _fetched/
          git config user.name "logo-bot"
          git config user.email "logo-bot@users.noreply.github.com"
          git add _fetched
          git commit -m "Fetched sources (CI)" || echo "nothing"
          git push
